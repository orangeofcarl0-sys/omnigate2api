services:
  omnigate2api:
    build:
      context: .
      args:
        # Go 模块代理链（构建期）：可用 OMNIGATE_GOPROXY 覆盖，默认镜像源优先。
        GOPROXY: ${OMNIGATE_GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
    container_name: omnigate2api
    restart: unless-stopped
    ports:
      # 默认本地：仅本机可达（API Key 无需作为防线；局域网共享/远程管理时
      # 改为 "7866:7866" 即为开放方案，需配合 OMNIGATE_API_KEY 使用）。
      - "127.0.0.1:7866:7866"
    environment:
      # 本地默认免密（空 = 关闭鉴权）；开放方案（7866:7866）必须设置真实 Key
      OMNIGATE_API_KEY: ${OMNIGATE_API_KEY:-}
      TZ: Asia/Shanghai
      OMNIGATE_DEBUG_PROMPTS: /app/data/prompts
      # 内存边界（运维）：Go 堆软上限 + 更积极的 GC 触发，抑制大请求体/长会话尖峰。
      # 软上限不会 OOM（超限时 GC 更频繁），仅约束增长曲线。
      # 登录排查开关（OMNIGATE_LOGIN_DEBUG=1 时打印 token 响应字段名/是否含 refresh_token）
      OMNIGATE_LOGIN_DEBUG: ${OMNIGATE_LOGIN_DEBUG:-}
      # 华为登录客户端版本实验开关（默认空 = 逆向基线 5.1.0）。华为文档「配置账号30天免登录」
      # 的 30 天档门槛是客户端 26.5.1+，是否作用于网关登录路径待实测（SPEC §24.4）：
      # 设成 26.5.1 后重登，看凭证 expiration 是否变成 ~30 天。
      OMNIGATE_LOGIN_PLUGIN_VERSION: ${OMNIGATE_LOGIN_PLUGIN_VERSION:-}
      # 配置审计转储（OMNIGATE_DEBUG_CONFIG=<目录>，空=关闭）：把 /v3/config 原始响应
      # 按区域落盘，用于"改上游解析前先列全部键路径"（SPEC §33.3）。
      OMNIGATE_DEBUG_CONFIG: ${OMNIGATE_DEBUG_CONFIG:-}
      # 出网代理（SPEC §24.7）：国际域直连极不稳（实测 6h 243 次 EOF/TLS 超时 → 客户端 503）。
      # v2rayN 的 xray 入站 10808 是**混合口**：SOCKS5 与 HTTP CONNECT 都吃，不必另开 10809。
      # 容器经 host.docker.internal 到宿主机回环；NO_PROXY 内的域直连（绕道出海只会更慢更不稳）。
      #   HTTPS_PROXY=http://host.docker.internal:10808    （socks5:// 亦可，标准库原生支持）
      #   NO_PROXY=copilot.tencent.com,codebuddy.cn,workbuddy.cn,workbuddy.ai,myhuaweicloud.com,huaweicloud.com,localhost,127.0.0.1
      # workbuddy.ai 也在 NO_PROXY 里（8/9 个账号的 domain 就是它）。但注意：容器出网实际
      # 由 Docker mirrored 网络统一交给 v2rayN 按白名单分流，**NO_PROXY 并不能让它真绕开代理**
      # （实测容器直连国内站出口=杭州电信、直连国外站出口=节点）。要让它直连得在 v2rayN 里加
      # `domain:workbuddy.ai → direct` 路由；这条 NO_PROXY 只是语义正确、无副作用（SPEC §24.7 第 4 条）。
      # 注意 huaweicloud.com 与 myhuaweicloud.com 是两个父域，Go 的 NO_PROXY 不做跨父域覆盖，都要列。
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      GOMEMLIMIT: 192MiB
      GOGC: "75"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
